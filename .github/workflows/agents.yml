name: Agents

# Evidence-driven agent tasks (ADR-0032, spec 015). The task files in .agents/tasks/ are the source of truth;
# `pnpm agents:check` fails when a task's cron is missing below or a cron below belongs to no task.
#
#   gh workflow run agents.yml -f task=spec-gap -f harness=claude
#
# Every run starts with the task's signal; no signal, no agent, no cost. An edit task's change is kept only if the
# runner's guard and gates pass, and then opens a DRAFT pull request. Nothing merges itself.
#
# Off by default: this repo ships the setup as a sample. Schedules run only when the repository variable
# AGENTS_ENABLED is 'true' (Settings → Secrets and variables → Actions → Variables). A manual run or the
# `agent-review` label is explicit intent and needs only the key. The guard job always runs; it costs no model calls.
#
# Secrets (a missing key skips the run with a notice, so forks and fresh clones stay green):
#   ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (claude) · OPENAI_API_KEY (codex) · GEMINI_API_KEY (gemini)
#   AGENT_GITHUB_TOKEN (optional): a fine-grained token or GitHub App token with contents, issues and pull-requests
#     write. Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so CI would not run on
#     them.
#
# Issues (spec 020, ADR-0037): the `issue` job checks every opened or edited issue against the story template, labels
# it and comments, posts a plan, and on `/approve` from a user with write access implements it into one draft pull
# request from agent/issue-<n>-<slug>; one run per issue at a time. Without a Claude credential only the runner-only
# stages run; the repository variable AGENT_HARNESS=fake proves the whole path with canned output and no model.
# AGENT_GITHUB_LOGIN (variable, optional): the runner's login when AGENT_GITHUB_TOKEN is a GitHub App token.
#
# Every action is pinned by commit SHA, and every harness CLI by version; bumps are deliberate commits.

on:
  schedule:
    - cron: '17 5 * * 1' # spec-gap
    - cron: '29 5 * * 2' # dependency-audit
    - cron: '37 5 * * 6' # translation-review
  workflow_dispatch:
    inputs:
      task:
        description: Task name (a file in .agents/tasks/)
        required: true
      harness:
        description: Harness (default = defaultHarness in .agents/policy.json)
        type: choice
        options: [default, claude, codex, gemini]
        default: default
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  plan:
    name: Which tasks are due
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.AGENTS_ENABLED == 'true')
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.due.outputs.tasks }}
      harness: ${{ steps.due.outputs.harness }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: due
        env:
          TASK: ${{ inputs.task }}
          CRON: ${{ github.event.schedule }}
          HARNESS: ${{ inputs.harness }}
        run: |
          if [ -z "$HARNESS" ] || [ "$HARNESS" = default ]; then HARNESS="$(jq -r '.defaultHarness // "claude"' .agents/policy.json)"; fi
          echo "harness=$HARNESS" >> "$GITHUB_OUTPUT"
          if [ -n "$TASK" ]; then names="$TASK"; else names="$(node tooling/agents/agents.mjs due --cron "$CRON")"; fi
          echo "tasks=$(printf '%s\n' "$names" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  run:
    name: Run ${{ matrix.task }}
    needs: plan
    if: needs.plan.outputs.tasks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    env:
      HARNESS: ${{ needs.plan.outputs.harness }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check the harness key
        id: key
        run: |
          case "$HARNESS" in
            claude) key="$ANTHROPIC_API_KEY" ;; codex) key="$OPENAI_API_KEY" ;; gemini) key="$GEMINI_API_KEY" ;;
            *)
              echo "::notice::This workflow installs claude, codex or gemini, not $HARNESS; run it on your own machine. See .agents/README.md."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ -z "$key" ]; then
            echo "::notice::No API key for $HARNESS; skipping ${{ matrix.task }}. See .agents/README.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.skip != 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
      - name: Install Rust toolchain
        if: steps.key.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Rust cache
        if: steps.key.outputs.skip != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pnpm
        if: steps.key.outputs.skip != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        if: steps.key.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies and the harness
        if: steps.key.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:libs
          case "$HARNESS" in
            claude) npm install -g @anthropic-ai/claude-code@2.1.305 ;;
            codex) npm install -g @openai/codex@0.161.0 ;;
            gemini) npm install -g @google/gemini-cli@0.53.1 ;;
          esac
          git config user.name "tran-agent"
          git config user.email "tran-agent@users.noreply.github.com"
      - name: Signal, agent, guard, gates, draft pull request
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
        run: node tooling/agents/agents.mjs run "${{ matrix.task }}" --harness "$HARNESS" --publish
      - name: Upload the prompt, log and verification
        if: always() && steps.key.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-${{ matrix.task }}
          path: .agents/out
          if-no-files-found: ignore
          retention-days: 14

  guard:
    name: Agent guard (scope, protected paths, line budget)
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Run the base branch's guard: a pull request must not judge itself with code it changed. The guard
      # then reads the policy and task files from the base commit too (`--committed`).
      - name: Use the runner from the base branch
        run: git checkout "origin/${{ github.base_ref }}" -- tooling/agents tooling/spec-check
      - name: Guard
        env:
          AGENT_BRANCH: ${{ github.head_ref }}
          AGENT_BASE: origin/${{ github.base_ref }}
        run: node tooling/agents/agents.mjs guard --committed

  review:
    name: Agent code review (read-only)
    # Opt-in per pull request: a maintainer adds the `agent-review` label. Re-add it to review again.
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'labeled' &&
      github.event.label.name == 'agent-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check the key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; skipping the review."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - name: Review
        if: steps.key.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_BASE: origin/${{ github.base_ref }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.305
          node tooling/agents/agents.mjs run code-review --harness claude --publish --pr "${{ github.event.pull_request.number }}"

  issue:
    name: Issue #${{ github.event.issue.number }}
    # Never for a bot: the runner's own comments and labels must not start it again (REQ-ISS-019). With a
    # fine-grained AGENT_GITHUB_TOKEN the sender is a user, so the runner also skips its own marker and labels.
    if: >-
      (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
      github.event.sender.type != 'Bot' && vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per issue: a newer queued run replaces an older queued one, never the one running (REQ-ISS-003).
    concurrency:
      group: agents-issue-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Only the harness credential and the GitHub token: no deploy secret ever reaches this job (REQ-ISS-017).
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
      AGENT_HARNESS: ${{ vars.AGENT_HARNESS }}
      AGENT_GITHUB_LOGIN: ${{ vars.AGENT_GITHUB_LOGIN }}
    steps:
      # The agent token pushes the branch, so CI runs on the pull request it opens.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.AGENT_GITHUB_TOKEN || github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Without a credential the model stages skip; the structural gate and its labels still run (REQ-ISS-016).
      - name: Check the harness credential
        id: key
        run: |
          harness="${AGENT_HARNESS:-$(node -p "require('./.agents/policy.json').defaultHarness || 'claude'")}"
          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          model=yes
          case "$harness" in
            fake) ;;
            claude)
              if [ -z "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
                echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN: model stages are skipped; the structural gate and its labels still run. See .agents/README.md."
                model=no
              fi ;;
            *)
              echo "::notice::The issue job runs the claude or fake harness, not $harness: model stages are skipped. See .agents/README.md."
              model=no ;;
          esac
          echo "model=$model" >> "$GITHUB_OUTPUT"
          if [ "$model" = no ]; then echo "AGENT_MODEL_STAGES=skip" >> "$GITHUB_ENV"; fi
      # Only an event that may build (`/approve`, `/implement`, or a gate under `autonomy.simple: auto`) installs the
      # toolchain that the `issue` task's gates need; the gate and the plan need Node alone.
      - name: Does this event build
        id: stage
        if: steps.key.outputs.model == 'yes'
        run: |
          build="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { needsToolchain } from './tooling/agents/issue-commands.mjs'; const read = (path) => JSON.parse(readFileSync(path, 'utf8')); console.log(needsToolchain(read(process.env.GITHUB_EVENT_PATH), read('.agents/policy.json')) ? 'yes' : 'no');")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        if: steps.stage.outputs.build == 'yes'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Rust cache
        if: steps.stage.outputs.build == 'yes'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pnpm
        if: steps.stage.outputs.build == 'yes'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install workspace dependencies
        if: steps.stage.outputs.build == 'yes'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:libs
          git config user.name "tran-agent"
          git config user.email "tran-agent@users.noreply.github.com"
      - name: Install Claude Code
        if: steps.key.outputs.model == 'yes' && steps.key.outputs.harness == 'claude'
        run: npm install -g @anthropic-ai/claude-code@2.1.305
      - name: Gate, plan or implementation
        env:
          HARNESS: ${{ steps.key.outputs.harness }}
        run: node tooling/agents/agents.mjs issue --event "$GITHUB_EVENT_PATH" --harness "$HARNESS"
      - name: Upload the prompt, report and decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-issue-${{ github.event.issue.number }}
          path: .agents/out
          if-no-files-found: ignore
          retention-days: 14
