name: Screenshots and metrics

# Drift that behaviour tests miss (ADR-0031): screens that look different, bundles that grow,
# pages that score lower. Nightly + manual dispatch only, like the native suites (ADR-0021).
#
#   gh workflow run baselines.yml --ref <branch>
#
# Screenshot references are never committed. CI keeps its own in the Actions cache, per OS: the
# first run records them, later runs compare. A failure uploads the diff images. Metrics are judged
# against tooling/metrics/budgets.json and docs/reports/metrics.json; CI never records history.
# Every action is pinned by commit SHA below; bumps are deliberate commits.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 04:47 UTC; scheduled runs execute the default branch.
    - cron: '47 4 * * *'

concurrency:
  group: baselines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web screenshots, metrics and release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      # A new key every run, restored from the latest: references recorded once stay the baseline.
      - name: Restore screenshot references
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e/.screenshots
          key: screenshots-web-${{ runner.os }}-${{ github.run_id }}
          restore-keys: screenshots-web-${{ runner.os }}-
      - name: Screenshots (every theme × locale)
        run: pnpm visual
      - name: Metrics (Lighthouse, timings, sizes vs budgets and history)
        run: pnpm metrics
      - name: Web release smoke
        run: pnpm --filter e2e exec playwright test -c playwright.metrics.config.ts --project smoke --grep web
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics
          path: .metrics/latest.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-screenshot-diffs
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android screenshots (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore screenshot references
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/android/app/.screenshots
          key: screenshots-android-${{ runner.os }}-${{ github.run_id }}
          restore-keys: screenshots-android-${{ runner.os }}-
      - name: Screenshots (every screen × theme × locale)
        run: pnpm android:screenshots
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshot-diffs
          path: apps/android/app/build/outputs/roborazzi
          if-no-files-found: ignore
          retention-days: 14
