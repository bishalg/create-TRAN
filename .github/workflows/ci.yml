name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rust-check:
    name: Rust (Core & Axum API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --workspace --verbose

      - name: Sync design tokens and verify generated artifacts
        run: |
          cargo run -p tran-tokens-codegen
          git diff --exit-code -- \
            packages/core-ts/src/generated \
            apps/web/src/styles/generated \
            apps/native/src/generated

  node-check:
    name: TypeScript & Frontend Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @tran/api build && pnpm --filter create-tran build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run TypeScript Tests
        run: pnpm run test:ts
