name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rust-check:
    name: Rust (Core & Axum API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Tests + 100% coverage gate (unit, parity fixtures, HTTP integration)
        run: cargo llvm-cov --workspace --ignore-filename-regex 'main.rs|tran-uniffi' --fail-under-lines 100 --fail-under-regions 100

      - name: Sync design tokens and verify generated artifacts
        run: |
          cargo run -p tran-tokens-codegen
          git diff --exit-code -- \
            packages/core-ts/src/generated \
            apps/web/src/styles/generated \
            apps/ios/Sources/TranVotingDemo/Generated \
            apps/android/app/src/main/kotlin/com/tran/voting/generated \
            apps/android/app/src/main/res

      - name: Regenerate UniFFI bindings and verify no drift
        run: |
          bash scripts/uniffi-generate.sh
          git diff --exit-code -- \
            apps/ios/Sources/TranVotingDemo/Generated/UniFFI \
            apps/android/app/src/main/kotlin/com/tran/voting/uniffi

  node-check:
    name: TypeScript & Frontend Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Actions pinned, Dependabot complete, overrides ranged, SECURITY.md (ADR-0033)
        run: pnpm run supply:check

      - name: One version in every package and app (ADR-0034)
        run: pnpm run release:check

      - name: Tooling scripts run through symlinked paths; code files stay at or under 800 lines
        run: pnpm run tooling:test

      - name: Build workspace packages
        run: pnpm --filter @tran/api build && pnpm --filter @tran/core build && pnpm --filter create-tran build

      - name: Formatting (Prettier)
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint (apps/web atoms enforcement)
        run: pnpm --filter web lint

      - name: Typecheck E2E
        run: pnpm --filter e2e typecheck

      - name: Spec traceability (every verified requirement has a citing test)
        run: pnpm run spec:check

      - name: Agent tasks, workflow crons and learnings are valid (ADR-0032)
        run: pnpm run agents:check

      - name: Tests + 100% coverage gate (unit, parity fixtures, components)
        run: pnpm run test:ts:coverage

  ios-smoke:
    name: iOS (XcodeGen + xcodebuild)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        # Retried: a Homebrew download timeout should not hide the build result.
        run: for _ in 1 2 3; do brew install xcodegen && exit 0; sleep 20; done; exit 1

      - name: Regenerate project (drift check)
        run: |
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
          git diff --exit-code -- apps/ios/TranVotingDemo.xcodeproj

      - name: Build for iOS Simulator (no signing)
        run: >
          xcodebuild -project apps/ios/TranVotingDemo.xcodeproj
          -scheme TranVotingDemo
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO

  android-smoke:
    name: Android (Gradle build + JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v4.4.4
      - name: Build debug APK, run JVM tests (parity fixtures, view models, screenshot rendering)
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

  # Advisory databases are remote: a registry timeout must not skip the test jobs, so audits run on their own
  # (still failing CI on a finding) and retry before giving up (ADR-0033).
  audit:
    name: Dependency audits (npm + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit
      - name: Known vulnerabilities in npm dependencies
        run: for _ in 1 2 3; do pnpm audit --audit-level high && exit 0; sleep 30; done; exit 1
      - name: Known vulnerabilities in Rust dependencies
        run: for _ in 1 2 3; do cargo audit --deny warnings && exit 0; sleep 30; done; exit 1

  e2e:
    name: E2E + BDD (Playwright, real API + web)
    runs-on: ubuntu-latest
    needs: [rust-check, node-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:libs
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run Gherkin scenarios
        run: pnpm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
