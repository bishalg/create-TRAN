name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rust-check:
    name: Rust (Core & Axum API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Tests + 100% coverage gate (unit, parity fixtures, HTTP integration)
        run: cargo llvm-cov --workspace --ignore-filename-regex 'tran-tokens-codegen|main.rs|tran-uniffi' --fail-under-lines 100 --fail-under-regions 100

      - name: Sync design tokens and verify generated artifacts
        run: |
          cargo run -p tran-tokens-codegen
          git diff --exit-code -- \
            packages/core-ts/src/generated \
            apps/web/src/styles/generated \
            apps/ios/Sources/TranVotingDemo/Generated \
            apps/android/app/src/main/kotlin/com/tran/voting/generated \
            apps/android/app/src/main/res

  node-check:
    name: TypeScript & Frontend Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @tran/api build && pnpm --filter @tran/core build && pnpm --filter create-tran build

      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint (apps/web atoms enforcement)
        run: pnpm --filter web lint

      - name: Typecheck E2E
        run: pnpm --filter e2e typecheck

      - name: Spec traceability (every verified requirement has a citing test)
        run: pnpm run spec:check

      - name: Tests + 100% coverage gate (unit, parity fixtures, components)
        run: pnpm run test:ts:coverage

  ios-smoke:
    name: iOS (XcodeGen + xcodebuild)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate project (drift check)
        run: |
          xcodegen generate --spec apps/ios/project.yml --project apps/ios
          git diff --exit-code -- apps/ios/TranVotingDemo.xcodeproj

      - name: Build for iOS Simulator (no signing)
        run: >
          xcodebuild -project apps/ios/TranVotingDemo.xcodeproj
          -scheme TranVotingDemo
          -destination 'generic/platform=iOS Simulator'
          build
          CODE_SIGNING_ALLOWED=NO

  android-smoke:
    name: Android (Gradle assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon assembleDebug

  e2e:
    name: E2E + BDD (Playwright, real API + web)
    runs-on: ubuntu-latest
    needs: [rust-check, node-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:libs
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run Gherkin scenarios
        run: pnpm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
