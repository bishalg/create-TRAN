name: Deploy

# Spec 032, ADR-0051, docs/DEPLOY.md.
# REQ-DEP-004: a version tag builds the API image once, with an SBOM and a provenance attestation,
#   publishes it and deploys that digest to staging. Nothing else builds an image.
# REQ-DEP-008: production is a manual dispatch with the digest staging ran, under the protected
#   `production` environment; it depends on no build job. Both deploys run scripts/deploy.sh ON the
#   host over SSH (deploy/remote.sh), with strict host-key checking.
# Switched off until the repository variable DEPLOY_ENABLED is 'true' (docs/CREDENTIALS.md): each
# environment then holds the variables DEPLOY_HOST, DEPLOY_KNOWN_HOSTS (optional DEPLOY_USER,
# DEPLOY_PATH) and the secret DEPLOY_SSH_KEY.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Production: the digest staging ran (sha256:<64 hex>)'
        required: true
        type: string

# Least privilege: each job asks for what it uses.
permissions: {}

jobs:
  deploy-off:
    name: Deploy is switched off
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Say so
        run: >-
          echo "::notice::Deploy is off; the image is still built and smoke-tested on a tag, but not
          published or deployed. TODO(credentials): DEPLOY_ENABLED, DEPLOY_HOST, DEPLOY_KNOWN_HOSTS,
          DEPLOY_SSH_KEY - the tagged image is published and deployed to a real host (docs/CREDENTIALS.md)"

  image-smoke:
    name: Prove the image by running it
    if: github.event_name == 'push'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read

  build-image:
    name: Build the image once (SBOM, provenance)
    if: github.event_name == 'push'
    needs: image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name and version
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the registry
        if: vars.DEPLOY_ENABLED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once, publish when deploy is on
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          build-args: |
            VERSION=${{ steps.names.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.names.outputs.name }}:${{ github.ref_name }}
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          provenance: mode=max
          sbom: true

      - name: The full reference by digest
        id: reference
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          NAME: ${{ steps.names.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the build returned no digest"
            exit 1
          fi
          echo "image=$NAME@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published \`$NAME@$DIGEST\`; promote it with image_digest \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy on the staging host
        env:
          IMAGE: ${{ needs.build-image.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/remote.sh staging "$IMAGE"

  deploy-production:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: The input is one image digest
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image_digest must be sha256:<64 lower-case hex>, the digest staging ran"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy on the production host
        env:
          DIGEST: ${{ inputs.image_digest }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash deploy/remote.sh production "ghcr.io/${REPOSITORY,,}/api@$DIGEST"
