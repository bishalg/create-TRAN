name: Mutation tests

# Robustness gate (ADR-0029, REQ-ROB-012): 100% line coverage proves code ran, not that a test would notice it
# breaking. Each mutant is a small bug planted in the source; a survivor is a missing test. Too slow for every pull
# request, so nightly + manual dispatch only, like the native suites (ADR-0021).
#
#   gh workflow run mutation.yml --ref <branch>
#
# Locally: `cargo mutants -p rust-core -p api -p tran-tokens-codegen` and `pnpm --filter @tran/core mutation`.
# Every action is pinned by commit SHA below; bumps are deliberate commits.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:41 UTC; scheduled runs execute the default branch.
    - cron: '41 3 * * *'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: cargo-mutants (rust-core, api, tran-tokens-codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      # Fails on any missed mutant; equivalent ones are listed, with a reason, in .cargo/mutants.toml.
      - name: Mutate
        run: cargo mutants -p rust-core -p api -p tran-tokens-codegen --no-shuffle -j 2 --timeout 120
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-mutants
          path: mutants.out
          if-no-files-found: ignore

  typescript:
    name: Stryker (packages/core-ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build @tran/api (imported from dist/)
        run: pnpm --filter @tran/api build
      # Fails below `thresholds.break` in packages/core-ts/stryker.config.json.
      - name: Mutate
        run: pnpm --filter @tran/core mutation
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker
          path: packages/core-ts/reports/mutation
          if-no-files-found: ignore
