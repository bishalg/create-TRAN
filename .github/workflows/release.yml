name: Release

# A pushed version tag becomes a GitHub release (ADR-0034, REQ-REL-004). Make the tag with:
#   pnpm release auto     # bumps every version and writes the CHANGELOG section; never tags
#   git commit -am "chore(release): vX.Y.Z" && git tag vX.Y.Z && git push origin HEAD vX.Y.Z
#
# The job refuses a tag that does not match the version, runs the Rust and TypeScript tests, builds the web app and
# the Android release APK, and publishes both with that version's CHANGELOG section as the notes. The APK is unsigned:
# signing keys belong to the project, not the template. iOS is not attached; an unsigned build is not installable.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run of the current version: every check and build runs
# and the files are kept as workflow artifacts, but nothing is published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Test, build and publish (dry run unless a tag)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@1cff18a4cfab5cd8d4c49a8ccf11c1ad18bb30b9 # v4.4.4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Release name (the pushed tag, or the current version on a dry run)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else tag="v$(node -p "require('./package.json').version")"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: The tag matches every version in the repo
        run: node tooling/release/release.mjs check --tag "$TAG"

      - name: Rust tests
        run: cargo test --workspace
      - name: TypeScript tests
        run: pnpm run test:ts

      - name: Build the web app
        run: |
          pnpm --filter web build
          tar -czf "web-$TAG.tar.gz" -C apps/web dist
      - name: Build the Android release APK (stages the Rust core)
        run: |
          (cd apps/android && ./gradlew --no-daemon :app:assembleRelease)
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "android-$TAG-unsigned.apk"

      - name: Keep the files of a dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            web-*.tar.gz
            android-*-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release with its CHANGELOG section
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tooling/release/release.mjs notes "$TAG" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md \
            "web-$TAG.tar.gz" "android-$TAG-unsigned.apk"
