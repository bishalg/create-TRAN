[workspace]
resolver = "2"
members = [
    "crates/rust-core",
    "crates/tran-tokens-codegen",
    "crates/tran-uniffi",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bishal Ghimire <bishal.ghimire@gmail.com>"]
license = "MIT"
repository = "https://github.com/bishalg/create-TRAN"

# ADR-0029: no ad-hoc output and no unexplained panics outside tests (`clippy.toml` allows them in
# tests). A justified `expect` carries `#[allow(clippy::expect_used, reason = "…")]`.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Networking
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "catch-panic"] }

# Tracing & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling & Utilities
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
uniffi = { version = "0.32", features = ["build"] }

# Sessions (ADR-0039): token digests, token encoding, the OS random source
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"

# Push senders (ADR-0046): hyper's client (hyper already serves axum) over rustls with Mozilla's
# roots, and aws-lc-rs, the crypto rustls runs on, to sign the APNs ES256 and Google RS256 JWTs, so
# signing adds no second crypto library.
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-tokio"] }
http-body-util = "0.1"
aws-lc-rs = "1"

# Internal Workspace Crates
rust-core = { path = "crates/rust-core" }
