name: TranVotingDemo
options:
  bundleIdPrefix: com.tran
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
targets:
  TranVotingDemo:
    type: application
    platform: iOS
    sources:
      - Sources/TranVotingDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tran.voting
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TRAN Voting
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
schemes:
  TranVotingDemo:
    build:
      targets:
        TranVotingDemo: all
    run:
      config: Debug
    archive:
      config: Release
