name: TranVotingDemo
options:
  bundleIdPrefix: com.tran
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  # Locales carried by Generated/Localizable.xcstrings; keep in sync with the shared dictionaries.
  developmentLanguage: en
  knownRegions:
    - en
    - ne
    - hi
    - Base
targets:
  TranVotingDemo:
    type: application
    platform: iOS
    sources:
      - Sources/TranVotingDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tran.voting
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TRAN Voting
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]: $(SRCROOT)/RustLib/aarch64-apple-ios-sim
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]: $(SRCROOT)/RustLib/x86_64-apple-ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/RustLib/aarch64-apple-ios
        OTHER_LDFLAGS:
          - -ltran_uniffi
          - -lc++
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TranVotingDemo/Generated/UniFFI/tran_uniffiFFI.h
        CLANG_ENABLE_MODULES: YES
    preBuildScripts:
      - name: Build tran-uniffi (Rust)
        script: |
          /bin/bash "${SRCROOT}/scripts/build-tran-uniffi.sh"
        basedOnDependencyAnalysis: false
  TranVotingDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TranVotingDemoTests
      - Sources/TranVotingDemo/Generated/UniFFI
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]: $(SRCROOT)/RustLib/aarch64-apple-ios-sim
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]: $(SRCROOT)/RustLib/x86_64-apple-ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/RustLib/aarch64-apple-ios
        OTHER_LDFLAGS:
          - -ltran_uniffi
          - -lc++
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TranVotingDemo/Generated/UniFFI/tran_uniffiFFI.h
        CLANG_ENABLE_MODULES: YES
    preBuildScripts:
      - name: Build tran-uniffi (Rust)
        script: |
          /bin/bash "${SRCROOT}/scripts/build-tran-uniffi.sh"
        basedOnDependencyAnalysis: false
  TranVotingDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TranVotingDemoUITests
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TranVotingDemo:
    build:
      targets:
        TranVotingDemo: all
        TranVotingDemoTests: [test]
        TranVotingDemoUITests: [test]
    test:
      targets:
        - TranVotingDemoTests
        - TranVotingDemoUITests
    run:
      config: Debug
    archive:
      config: Release
