name: TranVotingDemo
options:
  bundleIdPrefix: com.tran
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  # Locales carried by Generated/Strings/*.xcstrings; keep in sync with locales/ (the
  # native-strings parity test fails until this list matches the locale directories).
  developmentLanguage: en
  knownRegions:
    - en
    - ne
    - hi
    - Base
targets:
  TranVotingDemo:
    type: application
    platform: iOS
    sources:
      - Sources/TranVotingDemo
    # Explicit Info.plist (XcodeGen generates it): ATS exempts loopback only, and the API base URL
    # comes from the TRAN_API_BASE_URL build setting, so builds stay configurable (REQ-NAT-011).
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: TRAN Voting
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: '6.0'
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TranApiBaseUrl: $(TRAN_API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tran.voting
        TRAN_API_BASE_URL: http://127.0.0.1:3001
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]: $(SRCROOT)/RustLib/aarch64-apple-ios-sim
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]: $(SRCROOT)/RustLib/x86_64-apple-ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/RustLib/aarch64-apple-ios
        OTHER_LDFLAGS:
          - -ltran_uniffi
          - -lc++
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TranVotingDemo/Generated/UniFFI/tran_uniffiFFI.h
        CLANG_ENABLE_MODULES: YES
    preBuildScripts:
      - name: Build tran-uniffi (Rust)
        script: |
          /bin/bash "${SRCROOT}/scripts/build-tran-uniffi.sh"
        basedOnDependencyAnalysis: false
  TranVotingDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TranVotingDemoTests
      - Sources/TranVotingDemo/Generated/UniFFI
      - Sources/TranVotingDemo/Generated/L10n.swift
      - Sources/TranVotingDemo/Generated/BrandTokens.swift
      - Sources/TranVotingDemo/Api
      - Sources/TranVotingDemo/Extensions
      - Sources/TranVotingDemo/TranMotion.swift
      - Sources/TranVotingDemo/AuthSession.swift
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]: $(SRCROOT)/RustLib/aarch64-apple-ios-sim
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]: $(SRCROOT)/RustLib/x86_64-apple-ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/RustLib/aarch64-apple-ios
        OTHER_LDFLAGS:
          - -ltran_uniffi
          - -lc++
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TranVotingDemo/Generated/UniFFI/tran_uniffiFFI.h
        CLANG_ENABLE_MODULES: YES
    preBuildScripts:
      - name: Build tran-uniffi (Rust)
        script: |
          /bin/bash "${SRCROOT}/scripts/build-tran-uniffi.sh"
        basedOnDependencyAnalysis: false
  TranVotingDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TranVotingDemoUITests
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TranVotingDemo:
    build:
      targets:
        TranVotingDemo: all
        TranVotingDemoTests: [test]
        TranVotingDemoUITests: [test]
    test:
      targets:
        - TranVotingDemoTests
        - TranVotingDemoUITests
    run:
      config: Debug
    archive:
      config: Release
