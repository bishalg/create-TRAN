name: TranVotingDemo
options:
  bundleIdPrefix: com.tran
  # The platform floor (REQ-CODE-004, ADR-0045): the previous major release while iOS 27 is
  # current. No availability check at or below it anywhere in the app.
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  # Locales carried by Generated/Strings/*.xcstrings; keep in sync with locales/ (the
  # native-strings parity test fails until this list matches the locale directories).
  developmentLanguage: en
  knownRegions:
    - en
    - ne
    - hi
    - Base
targets:
  TranVotingDemo:
    type: application
    platform: iOS
    sources:
      - Sources/TranVotingDemo
      # Apple's privacy manifest, copied into the app bundle (REQ-MOB-010, store-readiness.test.ts).
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    # Explicit Info.plist (XcodeGen generates it): ATS exempts loopback only, and the API base URL
    # comes from the TRAN_API_BASE_URL build setting, so builds stay configurable (REQ-NAT-011).
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: TRAN Voting
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: '6.0'
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TranApiBaseUrl: $(TRAN_API_BASE_URL)
        # The store page "Update" opens (REQ-VER-011): the TRAN_IOS_STORE_URL build setting below.
        TranStoreUrl: $(TRAN_IOS_STORE_URL)
        # Export compliance (REQ-MOB-010): the app's only encryption is HTTPS through URLSession and the
        # system Keychain, which Apple exempts, so App Store Connect asks nothing per upload. A fork
        # that adds its own or a third-party cryptography (end-to-end messages, a VPN, a crypto
        # library) must answer Apple's export questions and change this to true.
        ITSAppUsesNonExemptEncryption: false
        # "Use my location" (spec 026, REQ-PRV-005, REQ-PRV-006): while in use only, reduced accuracy
        # by default, and never temporary full accuracy. The English text equals the catalogue's
        # `eligibility.location.purpose`; every locale's comes from the generated
        # Sources/TranVotingDemo/Generated/InfoPlist.xcstrings (`pnpm tokens:sync`).
        NSLocationWhenInUseUsageDescription: 'TRAN uses your approximate location once to find your country and pick the right voting age. It is optional; you can type the country instead.'
        NSLocationDefaultAccuracyReduced: true
        # Push (spec 027, REQ-PSH-012): whether this build is configured for push, and its APNs
        # environment. Both come from build settings below; the app reads them, never the env.
        TranPushEnabled: $(TRAN_PUSH_ENABLED)
        TranApsEnvironment: $(TRAN_APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tran.voting
        TRAN_API_BASE_URL: http://127.0.0.1:3001
        # The App Store page of this app (REQ-VER-011); the placeholder until it has a listing:
        #   xcodebuild … TRAN_IOS_STORE_URL=https://apps.apple.com/app/id<TRAN_ASC_APP_ID>
        TRAN_IOS_STORE_URL: https://tran.example/ios
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1000'
        TARGETED_DEVICE_FAMILY: '1,2'
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]: $(SRCROOT)/RustLib/aarch64-apple-ios-sim
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]: $(SRCROOT)/RustLib/x86_64-apple-ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/RustLib/aarch64-apple-ios
        OTHER_LDFLAGS:
          - -ltran_uniffi
          - -lc++
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TranVotingDemo/Generated/UniFFI/tran_uniffiFFI.h
        CLANG_ENABLE_MODULES: YES
        # Push is a build-time switch (REQ-PSH-012, ADR-0046, docs/CREDENTIALS.md): NO by default,
        # so the app builds, runs and is tested unsigned with push reported unavailable. YES adds
        # the `aps-environment` entitlement (Support/TranVotingDemo.entitlements), which needs a
        # signing team whose App ID has the Push Notifications capability:
        #   xcodebuild … TRAN_PUSH_ENABLED=YES DEVELOPMENT_TEAM=<TRAN_APPLE_TEAM_ID>
        TRAN_PUSH_ENABLED: NO
        TRAN_PUSH_ENTITLEMENTS_YES: Support/TranVotingDemo.entitlements
        TRAN_PUSH_ENTITLEMENTS_NO: ''
        CODE_SIGN_ENTITLEMENTS: $(TRAN_PUSH_ENTITLEMENTS_$(TRAN_PUSH_ENABLED))
      configs:
        # The APNs environment the entitlement names and the registration sends (`sandbox` for
        # `development`).
        Debug:
          TRAN_APS_ENVIRONMENT: development
        Release:
          TRAN_APS_ENVIRONMENT: production
    preBuildScripts:
      - name: Build tran-uniffi (Rust)
        script: |
          /bin/bash "${SRCROOT}/scripts/build-tran-uniffi.sh"
        basedOnDependencyAnalysis: false
  TranVotingDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/TranVotingDemoTests
      - Sources/TranVotingDemo/Generated/UniFFI
      - Sources/TranVotingDemo/Generated/ApiContract.swift
      - Sources/TranVotingDemo/Generated/L10n.swift
      - Sources/TranVotingDemo/Generated/BrandTokens.swift
      - Sources/TranVotingDemo/Api
      - Sources/TranVotingDemo/Session
      - Sources/TranVotingDemo/Extensions
      - Sources/TranVotingDemo/TranMotion.swift
      - Sources/TranVotingDemo/AuthSession.swift
      - Sources/TranVotingDemo/Feedback/TranFeedback.swift
      - Sources/TranVotingDemo/Feedback/TranReporting.swift
      - Sources/TranVotingDemo/Permissions
      - Sources/TranVotingDemo/Push
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]: $(SRCROOT)/RustLib/aarch64-apple-ios-sim
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=x86_64]: $(SRCROOT)/RustLib/x86_64-apple-ios
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/RustLib/aarch64-apple-ios
        OTHER_LDFLAGS:
          - -ltran_uniffi
          - -lc++
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TranVotingDemo/Generated/UniFFI/tran_uniffiFFI.h
        CLANG_ENABLE_MODULES: YES
    preBuildScripts:
      - name: Build tran-uniffi (Rust)
        script: |
          /bin/bash "${SRCROOT}/scripts/build-tran-uniffi.sh"
        basedOnDependencyAnalysis: false
  TranVotingDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    # Tests/TranVotingDemoUITests/Resources/screens.json, the scenario catalogue `pnpm tokens:sync`
    # writes (ADR-0038), is bundled as a resource from this folder: Bundle(for:) loads it. The
    # String Catalogs are compiled in too, so the interpreter resolves copy the way the app does.
    sources:
      - Tests/TranVotingDemoUITests
      - Sources/TranVotingDemo/Generated/ScreenContract.swift
      - Sources/TranVotingDemo/Generated/BrandTokens.swift
      - Sources/TranVotingDemo/Generated/Strings
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # Screenshot comparison (REQ-PERF-007, ADR-0031): its own scheme, so `pnpm ios:test` never
  # records images; run it with `pnpm ios:screenshots`. Reads the theme registry from the
  # generated tokens; no third-party code.
  TranVotingDemoScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/TranVotingDemoScreenshotTests
      - Sources/TranVotingDemo/Generated/BrandTokens.swift
      - Sources/TranVotingDemo/Generated/ScreenContract.swift
    dependencies:
      - target: TranVotingDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TranVotingDemoScreenshots:
    build:
      targets:
        TranVotingDemo: all
        TranVotingDemoScreenshotTests: [test]
    test:
      targets:
        - TranVotingDemoScreenshotTests
  TranVotingDemo:
    build:
      targets:
        TranVotingDemo: all
        TranVotingDemoTests: [test]
        TranVotingDemoUITests: [test]
    test:
      targets:
        - TranVotingDemoTests
        - TranVotingDemoUITests
    run:
      config: Debug
    archive:
      config: Release
