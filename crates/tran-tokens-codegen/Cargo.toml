[package]
name = "tran-tokens-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "In-repo codegen CLI: rust-core tokens + locales → TS, CSS, Swift, Kotlin (ADR-0025)"
publish = false

[lib]
name = "tran_tokens_codegen"
path = "src/lib.rs"

[[bin]]
name = "tran-tokens-codegen"
path = "src/main.rs"

[dependencies]
rust-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
