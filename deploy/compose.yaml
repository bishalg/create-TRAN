# Reference deploy target: Docker Compose on one host (REQ-DEP-005, ADR-0051)
services:
  api:
    image: ${API_IMAGE}
    read_only: true
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - HOST=0.0.0.0
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL:-/data/api.sqlite3}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - METRICS_ADDR=${METRICS_ADDR:-}
      - MIGRATE_ON_START=false
    volumes:
      - data:/data
      - tmp:/tmp
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

volumes:
  data:
  tmp:
