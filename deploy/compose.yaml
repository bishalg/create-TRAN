# Reference deploy target: Docker Compose on one host (spec 032 REQ-DEP-005, ADR-0051, docs/DEPLOY.md).
# Driven by scripts/deploy.sh, which exports every variable below; nothing here differs between
# environments. Two API slots (blue, green) run the old and the new image side by side on one SQLite
# file in WAL mode; the proxy owns the public port and sends traffic to the slot the script names in
# ${DEPLOY_PROXY_DIR}/active.conf. Each slot publishes on loopback only, for the readiness probe.

x-api: &api
  read_only: true
  user: '10001:10001'
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: ${DEPLOY_GRACE_SECONDS:-30}s
  # The target's configuration lives on the host, never in the image or the repository.
  env_file: ${DEPLOY_ENV_FILE:?scripts/deploy.sh sets the env file}
  environment:
    # Migrations are their own deploy step (REQ-DB-003), never a side effect of starting.
    MIGRATE_ON_START: 'false'
  volumes:
    # The image's /data is owned by uid 10001, so a new named volume starts writable by it.
    - data:/data
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  networks: [internal]

services:
  api-blue:
    <<: *api
    image: ${API_BLUE_IMAGE:?scripts/deploy.sh sets the blue image}
    ports: ['127.0.0.1:${API_BLUE_PORT:-3101}:3001']

  api-green:
    <<: *api
    image: ${API_GREEN_IMAGE:?scripts/deploy.sh sets the green image}
    ports: ['127.0.0.1:${API_GREEN_PORT:-3102}:3001']

  proxy:
    # nginx:1.30.6-alpine3.24 (stable)
    image: nginx:1.30.6-alpine3.24@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
    # Skip the image's entrypoint scripts: they rewrite files the read-only root cannot hold.
    entrypoint: ['nginx', '-g', 'daemon off;']
    read_only: true
    restart: unless-stopped
    ports: ['${PUBLIC_PORT:-8080}:8080']
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_PROXY_DIR:?scripts/deploy.sh sets the proxy state folder}:/etc/nginx/tran:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks: [internal]

networks:
  internal:

volumes:
  data:
