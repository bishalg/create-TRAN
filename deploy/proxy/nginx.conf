# The reverse proxy of the Compose target (deploy/compose.yaml, docs/DEPLOY.md). It owns the public
# port and forwards to the API slot named in /etc/nginx/tran/active.conf, which scripts/deploy.sh
# writes and then applies with `nginx -s reload`: new connections go to the new slot while old
# workers finish their requests. TLS terminates in front of this (a fork's load balancer or a TLS
# proxy); set TRUSTED_PROXIES in the env file to this network's subnet (docs/RATE_LIMITING.md).
worker_processes 1;
pid /var/run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # The API writes its own access log; this one would duplicate it.
    access_log off;
    server_tokens off;
    # Docker's DNS: the slot's address is looked up per request, so the proxy starts and keeps
    # running whichever slot is up.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;
        # Sets $tran_api_upstream, for example: set $tran_api_upstream http://api-green:3001;
        include /etc/nginx/tran/active.conf;

        location / {
            proxy_pass $tran_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
