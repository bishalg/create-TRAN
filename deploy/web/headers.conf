# nginx: the same response headers and cache rules as `_headers` (REQ-DEP-009), for a server block
# that serves apps/web/dist as its root:   include /etc/nginx/snippets/tran-web.conf;
# nginx drops inherited add_header lines in a location that has its own, so each location repeats
# the security headers; `always` keeps them on 4xx and 5xx answers too.
# apps/web/tests/deploy-headers.test.ts checks this file against `_headers` and the page's policy.

# Hashed assets never change under their name.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}

# Every other path: the HTML entry points and the app's deep links (served by index.html), which
# revalidate on every load.
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
}
