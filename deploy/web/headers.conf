# Caddy / Nginx header configuration for web app (REQ-DEP-009)

# Cache immutable assets
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# HTML entrypoints revalidate
location ~ ^/(index\.html|account-deletion\.html)?$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';";
}
